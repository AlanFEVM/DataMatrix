name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify desktop host resource
        shell: pwsh
        run: |
          $asarEntries = npx asar list "release/win-unpacked/resources/app.asar"
          if (-not ($asarEntries | Select-String '[\\/]desktop-host\.js$' -Quiet)) { throw "Desktop host module is missing from the package" }
          if (-not (Test-Path "release/win-unpacked/resources/app.asar.unpacked/node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node")) { throw "Koffi native module is missing from the package" }
      - uses: actions/upload-artifact@v4
        with:
          name: DataMatrix-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
