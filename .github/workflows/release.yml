name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) { throw "Electron runtime installation failed" }
      - run: npm run check
      - name: Build Windows packages
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath packaging.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content packaging.log -Tail 40) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging failed::$escaped"
            exit $buildExitCode
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify package artifacts
        shell: pwsh
        run: |
          $version = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          $expected = @(
            "release/DataMatrix-Setup-$version-x64.exe",
            "release/DataMatrix-Portable-$version-x64.exe",
            "release/DataMatrix-Portable-$version-x64.zip"
          )
          foreach ($artifact in $expected) {
            if (-not (Test-Path $artifact)) { throw "Package artifact is missing: $artifact" }
          }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/*.exe release/*.zip --generate-notes --title "数据矩阵 $env:GITHUB_REF_NAME"
