name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Electron runtime
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) { throw "Electron runtime installation failed" }
      - run: npm run check
      - name: Build Windows packages
        shell: pwsh
        run: |
          npm run dist 2>&1 | Tee-Object -FilePath packaging.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content packaging.log -Tail 40) -join "`n"
            $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging failed::$escaped"
            exit $buildExitCode
          }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify desktop host resource
        shell: pwsh
        run: |
          $asarEntries = npx asar list "release/win-unpacked/resources/app.asar"
          if (-not ($asarEntries | Select-String '[\\/]desktop-host\.js$' -Quiet)) { throw "Desktop host module is missing from the package" }
          if (-not (Test-Path "release/win-unpacked/resources/app.asar.unpacked/node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node")) { throw "Koffi native module is missing from the package" }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME release/*.exe release/*.zip --generate-notes --title "数据矩阵 $env:GITHUB_REF_NAME"
